name: XRobot Module source compile
on:
  push:
  pull_request:
  schedule:
    - cron: '0 3 1 * *'
permissions:
  contents: read
jobs:
  compile:
    uses: xrobot-org/XRobot/.github/workflows/module-build.yml@dev
    with:
      libxr_ref: ${{ vars.LIBXR_CANDIDATE_REF || 'dev' }}
      tooling_ref: ${{ vars.XROBOT_CANDIDATE_REF || 'dev' }}
